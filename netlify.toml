# Static site: nothing to build, just publish the repo root.
[build]
  publish = "."
  command = ""

# wind.json is rewritten every three hours, so never let a CDN pin it.
[[headers]]
  for = "/data/wind.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Race Day fetches these three live on every load (see dashboard/race_day.html) —
# regatta_data.js and payload.json can be regenerated independently of an HTML
# deploy, so a CDN-cached copy would silently go stale.
[[headers]]
  for = "/dashboard/race_day.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/dashboard/regatta_data.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/site/payload.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# The v1 dataset is a read API: any site should be able to fetch it cross-origin.
# Short cache because the wind and the standings move during the regatta.
[[headers]]
  for = "/data/v1/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/data/v1/tracks/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"

# The brief carries client race data. Keep it out of search results.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
